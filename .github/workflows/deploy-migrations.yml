name: Deploy migrations

on:
  workflow_dispatch:
  push:
    branches:
      - 001-club-leaderboard
      # Lets the pending fix reach the hosted project before this branch is
      # merged; remove after merging.
      - claude/relaxed-bardeen-loxpz5
    paths:
      - supabase/migrations/**
      - .github/workflows/deploy-migrations.yml

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL_SECRET: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Find the hosted project
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_URL_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret for $name is not set"
              exit 1
            fi
          done
          if ! [[ "$SUPABASE_URL_SECRET" =~ https://([a-z0-9]+)\.supabase\.co ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL is not a https://<ref>.supabase.co URL"
            exit 1
          fi
          echo "::add-mask::${BASH_REMATCH[1]}"
          echo "SUPABASE_PROJECT_REF=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          # Accept a token pasted as NAME=value, quoted, padded, or copied from
          # the CLI's macOS keychain entry (go-keyring-base64:<base64>).
          token="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^SUPABASE_ACCESS_TOKEN=//' -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'$/\1/")"
          if [[ "$token" == go-keyring-base64:* ]]; then
            token="$(printf '%s' "${token#go-keyring-base64:}" | base64 -d)"
          fi
          if [[ "$token" != sbp_* ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must be a personal access token starting with sbp_ (create one at https://supabase.com/dashboard/account/tokens)"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          password="$(printf '%s' "$SUPABASE_DB_PASSWORD" | tr -d '\r\n' | sed -e 's/^SUPABASE_DB_PASSWORD=//')"
          echo "::add-mask::$password"
          echo "SUPABASE_DB_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase migration list
      - run: supabase db push
