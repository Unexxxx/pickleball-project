name: Deploy migrations

on:
  workflow_dispatch:
  push:
    branches:
      - 001-club-leaderboard
      # Lets the pending fix reach the hosted project before this branch is
      # merged; remove after merging.
      - claude/relaxed-bardeen-loxpz5
    paths:
      - supabase/migrations/**
      - .github/workflows/deploy-migrations.yml

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL_SECRET: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Find the hosted project
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_URL_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret for $name is not set"
              exit 1
            fi
          done
          if ! [[ "$SUPABASE_URL_SECRET" =~ https://([a-z0-9]+)\.supabase\.co ]]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL is not a https://<ref>.supabase.co URL"
            exit 1
          fi
          echo "::add-mask::${BASH_REMATCH[1]}"
          echo "SUPABASE_PROJECT_REF=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase migration list
      - run: supabase db push
