name: CI

on:
  push:
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:client-secrets
      - run: npm test
      - run: npm run test:rotation
      - name: Load hosted E2E settings
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_CLUB_SLUG: ${{ secrets.E2E_CLUB_SLUG }}
          E2E_OTHER_CLUB_SLUG: ${{ secrets.E2E_OTHER_CLUB_SLUG }}
          E2E_EVENT_ID: ${{ secrets.E2E_EVENT_ID }}
          E2E_MATCH_ID: ${{ secrets.E2E_MATCH_ID }}
          E2E_PLAYER_SLUG: ${{ secrets.E2E_PLAYER_SLUG }}
        run: |
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SERVICE_ROLE_KEY E2E_USER_EMAIL E2E_USER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              exit 1
            fi
          done
          # Export only the secrets that are set, so tests fall back to their defaults.
          # Trim whitespace, a leading NAME= and surrounding quotes pasted from a .env line.
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SERVICE_ROLE_KEY E2E_USER_EMAIL E2E_USER_PASSWORD \
            E2E_CLUB_SLUG E2E_OTHER_CLUB_SLUG E2E_EVENT_ID E2E_MATCH_ID E2E_PLAYER_SLUG; do
            value="$(printf '%s' "${!name}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e "s/^$name=//" -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'$/\1/")"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              printf -v "$name" '%s' "$value"
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done
          url="$NEXT_PUBLIC_SUPABASE_URL"
          if [[ "$url" != http://* && "$url" != https://* ]] ||
            [[ "$url" == *[[:space:]\"\'\[\]\(\)]* ]]; then
            echo "::error::Secret NEXT_PUBLIC_SUPABASE_URL must be only the URL, like https://<project>.supabase.co (no name=, quotes, spaces or brackets)"
            exit 1
          fi
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
